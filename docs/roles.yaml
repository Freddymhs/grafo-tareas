# roles.yaml — los tipos de trabajo de esta área (C11, 2026-10-17). Una FASE declara su rol con la línea
# `**Tipo**: <marca>` de la cabecera; sin esa línea, cae en `defecto`. Es la fuente ÚNICA de:
#   · las plantillas de FASE (`plantilla`) que usan /work:resume:new-concept y /work:create-backlog,
#   · la etapa de cada FASE derivada de sus casillas (importar:fases de grafo-tareas, bin/fases),
#   · las columnas de cada tablero por rol en la PWA.
# Un rol nuevo = una entrada acá + su plantilla. Se copia a cada área con `nuevo-workspace`: cada empresa
# ajusta los suyos sin tocar los de otra. `bash tests/test_roles.sh` (dotfiles) falla si rol y plantilla no calzan.
#
# Complementos (C11, FASE 9 de grafo-tareas): lo que cuelga de un PBI sin ser un rol. Cada uno es un nodo `nodo` con la
# etiqueta `complemento:<clave>`, conectado PERTENECE_A su PBI. `accionable: false` = nota: no entra en «hoy puedo» ni en el
# tablero, se ve en el detalle del PBI. `escalera` (solo en DUDA) nombra la escalera de `refs.yaml` del área.
#
# Cómo se deriva la etapa: se recorren `etapas` de la última a la primera y gana la primera cuya condición
# se cumple; si ninguna, la primera. Condiciones:
#   siempre            — la etapa de arranque
#   tareas_alguna      — al menos una casilla tildada en `## Tareas`
#   grupo: <regex>     — al menos una casilla tildada bajo un `### ` de `## Tareas` cuyo título calza
#   qa: <casilla>      — esa casilla de `## QA` tildada de verdad (una «— no aplica» no cuenta como avance)
#   cierre_real        — URL commit, Evidencias o Wiki tildadas en `## Cierre oficial en Azure`
#   terminada          — todas las casillas de Understand, Tareas, QA y Cierre tildadas (regla de bin/fases)
#
# `que:` en una etapa = una línea que explica la columna (la que muestran fases.html/calidad.html bajo cada título).
# `curso: true` en una etapa = trabajo en curso (FASE 10 de grafo-tareas): lo que cuenta para «en curso» en el parte del día
# y en el aviso de más de dos a la vez. Entender, esperar el PR o estar aprobado no es estar haciendo.
version: 1
defecto: producto

roles:
  producto:
    nombre: Producto
    para: Features y PBI — lo que mueve el trabajo
    marcas: [producto, funcional]
    plantilla: backlog/plantillas/plantilla-producto.md
    grupos: {}
    qa: [Colección, Auditoría, Listo para PR]
    etapas:
      - { clave: entendimiento, columna: ENTENDIMIENTO, si: siempre, que: "revisar la HU y los criterios" }
      - { clave: codigo, columna: EN CODIGO, si: tareas_alguna, curso: true, que: "las tareas de la FASE" }
      - { clave: coleccion, columna: Collection Created, si: { qa: Colección }, curso: true, que: "construir/actualizar la colección Postman" }
      - { clave: auditoria, columna: TESTEADO, si: { qa: Auditoría }, curso: true, que: "correr newman y armar la historia" }
      - { clave: listo, columna: LISTO PARA PR, si: { qa: Listo para PR }, curso: true, que: "cerrar con el auditor la guía de pruebas" }
      - { clave: aprobado, columna: APROBADO, si: { qa: Mergeado }, que: "mergeado: el PR entró a la base (la casilla Mergeado; el cierre en Azure va en TRÁMITES DE CIERRE)" }
      - { clave: cerrado, columna: CERRADO, si: terminada, que: "todo tildado" }

  calidad:
    nombre: Calidad
    para: Refactor, Sonar, performance, logs, alertas y CI — sin cambiar contrato, con tests de rojo a verde
    marcas: [calidad]
    plantilla: backlog/plantillas/plantilla-calidad.md
    grupos: { amarrar: "amarrar|l[ií]nea base|arranque", red: "^red\\b|cierre de la malla|retirar", cambiar: "." }
    qa: [Listo para PR]
    etapas:
      - { clave: entendimiento, columna: ENTENDIMIENTO, si: siempre, que: "la tarjeta y el código" }
      - { clave: amarrar, columna: "AMARRAR 🧰", si: { grupo: amarrar }, curso: true, que: "línea base y tests contra el código sin tocar" }
      - { clave: cambiar, columna: "CAMBIAR 🧰", si: { grupo: cambiar }, curso: true, que: "el arreglo" }
      - { clave: red, columna: "RED 🧰", si: { grupo: red }, curso: true, que: "roturas, tsc, suite, alcance" }
      - { clave: pr, columna: Pull Request, si: { qa: Listo para PR }, que: "PR abierto" }
      - { clave: aprobado, columna: APROBADO, si: { qa: Mergeado }, que: "mergeado: el PR entró a la base (la casilla Mergeado; el cierre en Azure va en TRÁMITES DE CIERRE)" }
      - { clave: cerrado, columna: CERRADO, si: terminada, que: "todo tildado" }

  seguridad:
    nombre: Seguridad
    para: Login por defecto, secretos fuera del repo, webhooks firmados, que nada se cobre o revierta dos veces
    marcas: [seguridad]
    plantilla: backlog/plantillas/plantilla-seguridad.md
    grupos: { detectar: "detectar", corregir: "corregir", verificar: "verificar" }
    qa: [Listo para PR, Mostrado al equipo]
    etapas:
      - { clave: entendimiento, columna: ENTENDIMIENTO, si: siempre, que: "qué se expone y a quién" }
      - { clave: detectar, columna: DETECTAR, si: { grupo: detectar }, curso: true, que: "encontrar y medir el problema" }
      - { clave: corregir, columna: CORREGIR, si: { grupo: corregir }, curso: true, que: "el arreglo" }
      - { clave: verificar, columna: VERIFICAR, si: { grupo: verificar }, curso: true, que: "probar que ya no pasa" }
      - { clave: pr, columna: Pull Request, si: { qa: Listo para PR }, que: "PR abierto" }
      - { clave: mostrado, columna: MOSTRADO, si: { qa: Mostrado al equipo }, que: "contado al equipo" }
      - { clave: cerrado, columna: CERRADO, si: terminada, que: "todo tildado" }

  devex:
    nombre: DevEx
    para: Herramientas y código para el equipo — hooks, linters, scripts, onboarding (no retros ni propuestas sueltas)
    marcas: [devex]
    plantilla: backlog/plantillas/plantilla-devex.md
    grupos: { construir: "construir", probar: "probar" }
    qa: [Listo para PR, Adoptado]
    etapas:
      - { clave: entendimiento, columna: ENTENDIMIENTO, si: siempre, que: "qué le duele al equipo" }
      - { clave: construir, columna: CONSTRUIR, si: { grupo: construir }, curso: true, que: "la herramienta" }
      - { clave: probar, columna: PROBAR, si: { grupo: probar }, curso: true, que: "probada en un repo real" }
      - { clave: pr, columna: Pull Request, si: { qa: Listo para PR }, que: "PR abierto" }
      - { clave: adoptado, columna: ADOPTADO, si: { qa: Adoptado }, que: "el equipo la usa" }
      - { clave: cerrado, columna: CERRADO, si: terminada, que: "todo tildado" }

  incidente:
    nombre: Incidente
    para: Un bug en producción — reproducir, arreglar, verificar y explicar qué lo causó
    marcas: [incidente]
    plantilla: backlog/plantillas/plantilla-incidente.md
    grupos: { reproducir: "reproducir", arreglar: "arreglar", verificar: "verificar" }
    qa: [Listo para PR, Desplegado, Explicado]
    etapas:
      - { clave: reproducir, columna: REPRODUCIR, si: siempre, que: "verlo fallar" }
      - { clave: arreglar, columna: ARREGLAR, si: { grupo: arreglar }, curso: true, que: "el arreglo" }
      - { clave: verificar, columna: VERIFICAR, si: { grupo: verificar }, curso: true, que: "probar que ya no falla" }
      - { clave: pr, columna: Pull Request, si: { qa: Listo para PR }, que: "PR abierto" }
      - { clave: desplegado, columna: DESPLEGADO, si: { qa: Desplegado }, que: "en producción" }
      - { clave: explicado, columna: EXPLICADO, si: { qa: Explicado }, que: "qué lo causó, contado" }
      - { clave: cerrado, columna: CERRADO, si: terminada, que: "todo tildado" }

  negocio:
    nombre: Negocio
    para: Detectar una necesidad, conversarla con el analista o el líder y redactar el PBI; el PBI aprobado pasa a Producto
    marcas: [negocio]
    plantilla: backlog/plantillas/plantilla-negocio.md
    grupos: { detectar: "detectar", conversar: "conversar", redactar: "redactar" }
    qa: [PBI aprobado]
    etapas:
      - { clave: detectar, columna: DETECTAR, si: siempre, curso: true, que: "la necesidad" }
      - { clave: conversar, columna: CONVERSAR, si: { grupo: conversar }, curso: true, que: "con el analista o el líder" }
      - { clave: redactar, columna: REDACTAR, si: { grupo: redactar }, curso: true, que: "el PBI" }
      - { clave: aprobado, columna: PBI APROBADO, si: { qa: PBI aprobado }, que: "el PBI aprobado pasa a Producto" }
      - { clave: cerrado, columna: CERRADO, si: terminada, que: "todo tildado" }

complementos:
  duda-negocio:   { nombre: Duda de negocio, nodo: DUDA, escalera: negocio }
  duda-codigo:    { nombre: Duda de código, nodo: DUDA, escalera: codigo }
  espera:         { nombre: Esperando a otro (ya pedido), nodo: DUDA }
  dolor:          { nombre: Dolor (PBI vs código), nodo: TAREA, accionable: false }
  supuesto:       { nombre: Supuesto, nodo: TAREA, accionable: false }
  decision:       { nombre: Decisión, nodo: TAREA, accionable: false }
  para-decir:     { nombre: Para decir, nodo: DAILY_ITEM }
  propuesta:      { nombre: Propuesta, nodo: TAREA, accionable: true }
  tramite:        { nombre: Trámite, nodo: TAREA, accionable: true }
  apunte:         { nombre: Apunte de dominio, nodo: TAREA, accionable: false }
  evidencia:      { nombre: Evidencia, nodo: TAREA, accionable: false }
  trabajo-de-otro: { nombre: Trabajo de otro, nodo: TAREA, accionable: false }
  captura:        { nombre: Captura rápida, nodo: TAREA, accionable: true }
