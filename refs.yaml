proyecto: grafo-tareas
cliente: personal
rama_base: main
tracker: none                          # sin tracker de empresa (PORTAR §Capacidades opcionales): el hook de solo lectura deja usar el navegador libre
tablero: none                          # F0-F1: apagado hasta que Freddy elija (concepto § Cómo se crea, paso 2). El corte (FASE 5 tarea 2) lo cambia por el bloque de abajo
# tablero:                             # adaptador `grafo` (bin/adapters/grafo/, FASE 5): mismo contrato que Laboratorio/bin/adapters/todoist
#   kind: grafo
#   api: https://mac-mini-server.tail1798c7.ts.net:8443/api/v1   # despliegue.api + /api/v1 (FASE 12)
#   token_env: GRAFO_TOKEN              # opcional hasta que la API pida login (hoy no)
#   label: board
#   secciones: { entendimiento: ENTENDIMIENTO, codigo: EN CODIGO, coleccion: Collection Created, auditoria: TESTEADO, listo: LISTO PARA PR, amarrar: "AMARRAR 🧰", cambiar: "CAMBIAR 🧰", red: "RED 🧰", pr: Pull Request }   # las 9 de GET /etapas (smoke 2026-10-17)
#   entrada: { proyecto: grafo-tareas, seccion: Entrada }   # /flow:pbi:repartir la lee; sin ella pregunta. El adaptador no la usa: el carril es una RAMA
qa: none
despliegue:                            # FASE 12: dónde corre el grafo. La leen bin/desplegar, bin/probar-en-visor y el corte (tablero.api)
  ssh: mac-mini                        # alias de ~/.ssh/config
  app: grafo-tareas                    # vive en ~/apps/<app> del Mac Mini (convención de su ~/CLAUDE.md)
  api: https://mac-mini-server.tail1798c7.ts.net:8443    # tailscale serve → 127.0.0.1:3007
  web: https://mac-mini-server.tail1798c7.ts.net:10000   # tailscale serve → 127.0.0.1:3008
todoist:                               # los proyectos que se importan (FASE 17). La lee bin/importar-en-produccion
  trabajo: 6VhFQg6v45qcJHPc            # TRABAJO: lo real
  plan: 6P4h8Wp2pW59Fq2x               # 🚀 Draft trabajo: el plan de cada HU (/flow:brechas + /flow:pbi:repartir) → --cara PLAN
  fases_de: laboratorio                # «FASE 22» en una tarjeta es la FASE 22 del Laboratorio (fases-md:laboratorio): no se duplica (C10)
docs: { dir: docs }
repos: {}                              # los gates (typecheck/lint/test) por repo se llenan tras inspeccionar cada plantilla en new-project

# Escalera de una duda y rituales (C11, FASE 9). Son del ÁREA: las personas son del cliente. La API los lee por
# REFS_ARCHIVO. Este orquestador es personal y no tiene a quién escalar: el bloque del SAG (Carabantes, Tomás Soto,
# Nicolás) va en el refs.yaml del Laboratorio, al cortar. Formato:
#   escalera:
#     negocio: { antes: contrastar con el código, personas: [Tomás Carabantes, Tomás Soto] }
#     codigo:  { personas: [Tomás Soto, Tomás Carabantes] }
rituales: { daily: Daily, retro: Retro }

# Cómo se escribe cada persona en las tarjetas (D6, FASE 19): el importador del tablero cuelga un «BLOQUEO… esperando a
# X» de UNA persona. Son del cliente, no del código: van acá (la API las lee por REFS_ARCHIVO). Se toma la primera con un
# alias en el texto, así que va primero la que contiene a otra («Tomás Soto» contiene «Tomás»). «Tomás» a secas =
# Carabantes (C8, a confirmar). Hoy son las del SAG porque el grafo de producción es solo el SAG; al cortar, al
# refs.yaml del Laboratorio.
personas:
  Tomás Soto: [Tomás Soto, Tomas Soto, Thomas, Soto]
  Tomás Carabantes: [Tomás Carabantes, Tomas Carabantes, Tomás, Tomas, Carabantes]
  Fabián: [Fabián, Fabian]
