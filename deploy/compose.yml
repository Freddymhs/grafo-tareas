# grafo-tareas en el Mac Mini (FASE 12 y 27). Lo levanta deploy/desplegar-aqui.sh: el job `deploy` del CI en cada push a
# main, o `bin/desplegar` a mano en una emergencia. A mano solo para mirar (`docker compose ps`).
# Rutas relativas a esta carpeta: el orquestador en ~/apps/grafo-tareas y los repos adentro, como en el PC.
# Nada se publica en la LAN: Postgres sin puerto, API y PWA en 127.0.0.1; afuera solo `tailscale serve` (HTTPS).
# Las variables salen de deploy/.env: lo escribe desplegar-aqui.sh en cada despliegue (conserva la contraseña), 600, fuera de git.
name: grafo-tareas

x-reinicio: &reinicio
  # Convención del Mac Mini (~/CLAUDE.md, checklist punto 11): sin esto un reinicio deja el servicio muerto.
  restart: unless-stopped

services:
  postgres:
    <<: *reinicio
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: grafo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en deploy/.env}
      POSTGRES_DB: grafo_tareas
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U grafo -d grafo_tareas']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    <<: *reinicio
    build: ../grafo-tareas.api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:${PUERTO_API:?falta PUERTO_API}:3000'
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgresql://grafo:${POSTGRES_PASSWORD}@postgres:5432/grafo_tareas?schema=public
      # La PWA y la VR del tailnet, y la VR de prueba en el visor (adb reverse: su origen es localhost del Quest).
      CORS_ORIGINS: ${URL_WEB:?falta URL_WEB},${URL_VR:?falta URL_VR},http://localhost:4173,http://localhost:5173
      PINO_LOG_LEVEL: info
      THROTTLE_TTL: '60'
      THROTTLE_LIMIT: '100'
      ROLES_ARCHIVO: /area/roles.yaml
      REFS_ARCHIVO: /area/refs.yaml
      # El id del proyecto SAG tras migrar; vacío = lo busca por nombre en el espacio con método de trabajo.
      PROYECTO_POR_DEFECTO: ''
    volumes:
      # Los mismos archivos del área que usa bin/dev en el PC; la API los lee al arrancar.
      - ../docs/roles.yaml:/area/roles.yaml:ro
      - ../refs.yaml:/area/refs.yaml:ro

  web:
    <<: *reinicio
    build:
      context: ../grafo-tareas.web
      args:
        NEXT_PUBLIC_API_URL: ${URL_API:?falta URL_API}
    depends_on:
      - api
    ports:
      - '127.0.0.1:${PUERTO_WEB:?falta PUERTO_WEB}:3000'

  vr:
    # FASE 27: la VR del Quest, siempre encendida (antes solo existía mientras el ThinkPad corría bin/probar-en-visor).
    # Estática, nginx sin root; la URL de la API queda fija en el build, como la web.
    <<: *reinicio
    build:
      context: ../grafo-tareas.vr
      args:
        VITE_API_URL: ${URL_API:?falta URL_API}
    ports:
      - '127.0.0.1:${PUERTO_VR:?falta PUERTO_VR}:8080'

  respaldo:
    # pg_dump diario, 14 copias, en ~/respaldos/grafo-tareas del Mac Mini (D5): esa carpeta la copia cada día al
    # ThinkPad su lab-respaldo.timer, así el respaldo sale de la máquina. Un contenedor y no launchd: en este Mini
    # los LaunchAgents no siempre cargan (su ~/CLAUDE.md) y un LaunchDaemon pide sudo.
    <<: *reinicio
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      DIAS_A_GUARDAR: '14'
      SEGUNDOS_ENTRE_RESPALDOS: '86400'
      # Uptime Kuma (monitor push, intervalo 25 h): URL sin query, de deploy/.env. Vacía = no avisa. Ver deploy/.env.example.
      KUMA_PUSH_URL_RESPALDO: ${KUMA_PUSH_URL_RESPALDO:-}
    volumes:
      - ${DIR_RESPALDOS:-./respaldos}:/respaldos
    entrypoint:
      - sh
      - -c
      - |
        set -u
        while true; do
          archivo="/respaldos/grafo-$$(date +%Y-%m-%d_%H%M).dump"
          # Solo se poda si el dump nuevo salió bien y no está vacío: si pg_dump fallara 14 días seguidos, podar
          # igual borraría todos los respaldos.
          if pg_dump -h postgres -U grafo -d grafo_tareas -Fc -f "$$archivo.parcial" && [ -s "$$archivo.parcial" ]; then
            mv "$$archivo.parcial" "$$archivo"
            echo "respaldo: $$archivo ($$(du -h "$$archivo" | cut -f1))"
            # Aviso a Kuma solo tras un dump bueno: si falla 25 h seguidas, Kuma alerta. Si el aviso falla, el respaldo ya está.
            if [ -n "$$KUMA_PUSH_URL_RESPALDO" ]; then
              wget -q -O /dev/null -T 15 "$$KUMA_PUSH_URL_RESPALDO?status=up&msg=OK" \
                || echo "aviso: no se pudo avisar a Kuma (el respaldo sí salió)" >&2
            fi
            find /respaldos -name 'grafo-*.dump' -mtime +"$$DIAS_A_GUARDAR" -delete
          else
            rm -f "$$archivo.parcial"
            echo "respaldo FALLÓ: $$archivo (no se poda)" >&2
          fi
          sleep "$$SEGUNDOS_ENTRE_RESPALDOS"
        done

volumes:
  pgdata:
